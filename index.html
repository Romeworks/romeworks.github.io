<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romeworks</title>
<meta name="description" content="Romeworks makes small, fast games and apps for phones, built for one thumb.">
<link rel="icon" type="image/png" href="icon.png">
<style>
  :root { --ink: #0d1f33; --panel: #132b44; --cream: #f5f2df; --mint: #7cf9d5; --muted: #9bb1bd; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--ink); color: var(--cream);
         font: 17px/1.6 -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
         display: flex; align-items: center; justify-content: center; padding: 48px 16px; }
  main { width: 100%; max-width: 560px; text-align: center; }
  .mark { width: 96px; height: 96px; }
  h1 { font-size: 40px; letter-spacing: 0.08em; margin: 16px 0 4px; }
  .tag { color: var(--mint); letter-spacing: 0.2em; font-size: 13px; text-transform: uppercase; margin: 0 0 40px; }
  section { background: var(--panel); border-radius: 20px; padding: 28px 24px; text-align: left; }
  h2 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 14px; color: #d5dde3; }
  a { color: var(--mint); }
  .play { display: inline-block; background: var(--mint); color: var(--ink); text-decoration: none;
          font-weight: 600; padding: 12px 20px; border-radius: 12px; margin: 6px 0 16px; }
  .small { font-size: 14px; color: var(--muted); margin: 0; }
  footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <img class="mark" src="icon.png" alt="Romeworks logo">
  <h1>ROMEWORKS</h1>
  <p class="tag">Built for one thumb</p>

  <section>
    <h2>Core Courier</h2>
    <p>One-thumb endless arcade. Steer, dash through drones, keep the run alive.</p>
    <a class="play" href="https://play.google.com/store/apps/details?id=core.courier">Get it on Google Play</a>
    <p class="small">
      <a href="https://romeonombrejr.github.io/core-courier-site/privacy.html">Privacy policy</a>
      &nbsp;·&nbsp;
      <a href="https://romeonombrejr.github.io/core-courier-site/licenses.html">Licenses</a>
    </p>
  </section>

  <footer>Contact: <a href="mailto:romeworks.dev@gmail.com">romeworks.dev@gmail.com</a></footer>
</main>
</body>
</html>
